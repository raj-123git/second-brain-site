<style>

  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: #17191f;
         background: #f7f5f0; position: relative; }
  .aurora { position: absolute; inset: 0;
    background:
      radial-gradient(60% 55% at 12% 20%, rgba(64,196,180,.28), transparent 70%),
      radial-gradient(50% 50% at 88% 30%, rgba(150,130,255,.26), transparent 70%),
      radial-gradient(60% 50% at 70% 95%, rgba(255,190,140,.30), transparent 70%); }
  .card { position: absolute; inset: 56px; border: 1px solid rgba(23,25,31,.11); border-radius: 28px;
          background: rgba(255,255,255,.62); padding: 64px 72px; box-sizing: border-box; }
  .eyebrow { font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; font-size: 22px; letter-spacing: .18em;
             text-transform: uppercase; color: #4f5562; }
  h1 { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-weight: 500;
       font-size: 104px; line-height: 1; margin: 28px 0 22px; letter-spacing: -.01em; }
  .line { font-size: 38px; line-height: 1.25; color: #17191f; max-width: 980px; }
  .sub { margin-top: 26px; font-size: 27px; color: #464b56; }
  .sub span { color: #0b5cad; }
  .url { position: absolute; right: 72px; bottom: 52px; font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
         font-size: 26px; color: #0b5cad; }
  .mark { position: absolute; left: 72px; bottom: 44px; width: 64px; height: 64px; }
</style>
</head>

<div class="aurora"></div>
<div class="card">

  <h1>Raj Ranpariya</h1>
